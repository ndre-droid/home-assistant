name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SIGNING_KEYSTORE_B64: ${{ secrets.SIGNING_KEYSTORE_B64 }}
      SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
      SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signing key check
        run: |
          if [ -n "$SIGNING_KEYSTORE_B64" ]; then echo "::notice::Shared signing key present (in-place update possible)"; else echo "::warning::Shared signing key MISSING - APK will not update an installed app"; fi
      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon testDebugUnitTest 2>&1 | tee test.log || {
            grep -E "^e: |FAILED|What went wrong|Exception" -A2 test.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Build debug + release APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleRelease 2>&1 | tee build.log || {
            grep -E "^e: |error:|ERROR|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
          grep -i "signing key not found" build.log && echo "::warning::Built with debug key" || true
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: SmartFlow-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
      - name: Publish APK as release (direct download, no login)
        if: github.ref == 'refs/heads/redesign/glow'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk HomeFlow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HomeFlow.apk --title "HomeFlow 2.1 (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7} (Branch ${GITHUB_REF_NAME})" --latest
