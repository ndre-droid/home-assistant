name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build debug APK
        run: |
          set -o pipefail
          gradle assembleDebug 2>&1 | tee build.log || {
            grep -E "^e: |error:|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HomeFlow-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as release (direct download, no login)
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk HomeFlow.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest HomeFlow.apk --title "HomeFlow (neuester Build)" --notes "Automatisch gebaut aus ${GITHUB_SHA::7}" --latest
